<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mb-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 · Dev Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%236d5dfc%27/%3E%3Cpath d=%27M9 11h14M9 16h10M9 21h7%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/admin.css">
<style>
  .grid.home { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
  @media (max-width: 1100px) { .grid.home { grid-template-columns: 1fr; } }
  .stats.hero .stat { text-decoration: none !important; color: inherit; display: block; transition: border-color .15s, transform .1s; }
  a.stat:hover { border-color: var(--accent); transform: translateY(-1px); }
  .stat .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.hot { border-color: color-mix(in srgb, var(--warn) 60%, transparent); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
  .stat.hot .v { color: var(--warn); }
  #alerts { display: flex; flex-direction: column; gap: 8px; }
  #alerts:empty { display: none; }
  #alerts .callout { align-items: center; }
  #alerts .callout a { margin-left: auto; white-space: nowrap; font-weight: 600; }
  .prow { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .prow:last-child { border-bottom: none; }
  .prow b { min-width: 96px; }
  .prow .pv { font-family: var(--mono); font-size: 11px; color: var(--text2); background: var(--surface2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
  .prow .ps { flex: 1; min-width: 0; color: var(--text2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meter { margin: 10px 0 4px; }
  .meter .mh { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text2); margin-bottom: 5px; }
  .meter .mh b { color: var(--text); font-variant-numeric: tabular-nums; }
  .meter .bar { height: 10px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ok), var(--accent)); transition: width .5s; }
  .meter.warn .bar i { background: var(--warn); } .meter.err .bar i { background: var(--err); }
  .hours { display: flex; align-items: flex-end; gap: 2px; height: 44px; margin-top: 12px; }
  .hours i { flex: 1; background: var(--accent); opacity: .5; border-radius: 2px 2px 0 0; min-height: 1px; }
  .hours i.now { opacity: 1; }
  .ulist { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .ulist b { font-weight: 700; color: var(--text2); }
  .m-fable { color: #8b5cf6 !important; } .m-opus { color: #d97757 !important; } .m-sonnet { color: #3b82f6 !important; } .m-haiku { color: #10b981 !important; }
  .rrow { display: flex; align-items: center; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--line); text-decoration: none !important; color: inherit; font-size: 13px; }
  .rrow:last-child { border-bottom: none; }
  .rrow:hover .rq { color: var(--accent); }
  .rrow .rp { font-family: var(--mono); font-size: 11px; color: var(--text2); flex: none; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .rq { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .rw { font-size: 11.5px; color: var(--muted); flex: none; }
  .mini3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
</style>
</head>
<body>
<div class="app">
  <header id="topbar"></header>

  <div class="wrap">
    <section class="stats hero" id="kpis"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></section>
    <div class="setup" id="setupBanner" style="display:none"></div>
    <div id="alerts"></div>

    <div class="grid home">
      <div class="col">
        <section class="card">
          <h2><span class="ic" id="icAgent"></span>이슈 에이전트<span class="sp"></span><a class="more" href="/agent.html">대시보드 열기 <span id="icArrow"></span></a></h2>
          <div id="issueActive"></div>
          <div class="toolbar" style="margin-bottom:8px">
            <div class="field has-ico"><span class="ico" id="icTerm"></span><input id="issueCmd" placeholder="수동 시작: group/repo#12 · 이슈 URL · 스캔" autocomplete="off"></div>
            <button class="btn" onclick="issueCommand()">실행</button>
          </div>
          <div class="sec" style="margin:14px 0 6px"><span>최근 세션</span><span class="n" id="issueCount">0</span></div>
          <div id="issueRecent"></div>
        </section>

        <section class="card">
          <h2><span class="ic" id="icSearch"></span>리서치<span class="sp"></span><a class="more" href="/research.html">리서치로 가기 <span id="icArrow2"></span></a></h2>
          <div id="homeResearch"><div class="skel" style="margin:6px 0"></div></div>
        </section>

        <section class="card" id="homeWsCard" style="display:none">
          <h2><span class="ic" id="icWs"></span>작업 공간<span class="sp"></span><a class="more" href="/workspace.html">작업 공간으로 가기 <span id="icArrow5"></span></a></h2>
          <div id="homeWorkspace"></div>
        </section>
      </div>

      <div class="col">
        <section class="card">
          <h2><span class="ic" id="icPlat"></span>연동 상태<span class="sp"></span><a class="more" href="/platform.html">플랫폼 관리 <span id="icArrow3"></span></a></h2>
          <div id="homePorts"><div class="skel" style="margin:6px 0"></div></div>
        </section>

        <section class="card">
          <h2><span class="ic" id="icMcp"></span>Claude 사용량<span class="sp"></span><span class="hint" id="usageSrc"></span></h2>
          <div id="homeUsage"><div class="skel" style="margin:6px 0"></div></div>
        </section>

        <section class="card">
          <h2><span class="ic" id="icRooms"></span>메신저<span class="sp"></span><a class="more" href="/messenger.html">메신저 관리 <span id="icArrow4"></span></a></h2>
          <div id="homeMessenger"><div class="skel" style="margin:6px 0"></div></div>
        </section>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/ui.js"></script>
<script src="/admin.js"></script>
<script>
UI.topbar('home', '홈');
loadSystem();
['icArrow2', 'icArrow3', 'icArrow4', 'icArrow5'].forEach(id => { const e = $(id); if (e) e.innerHTML = I.arrow; });
{ const e = $('icWs'); if (e) e.innerHTML = I.terminal.replace('width="16" height="16"', 'width="14" height="14"'); }
const W_KOR = { NEW: '대기', RUNNING: '작업 중', DONE: '완료', FAILED: '실패', ABORTED: '중단' };
const SRC_KO = { agent: '이슈 에이전트', research: '리서치', chat: '채팅', ops: '운영 질의', maintain: '플랫폼 관리', workspace: '작업 공간' };

const kf = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'k' : String(n || 0);
const R_KOR = { NEW: '대기열', RUNNING: '조사 중', DONE: '완료', FAILED: '실패', ABORTED: '중단' };
const R_CLS = { NEW: 'wait', RUNNING: 'run', DONE: 'ok', FAILED: 'err', ABORTED: 'err' };
const R_VERIFY = { PASS: '검증 통과', FIXED: '검증 후 수정', FAIL: '검증 실패', SKIPPED: '검증 생략' };
const P_BADGE = { ok: ['ok', '정상'], warn: ['wait', '주의'], down: ['err', '실패'] };
const shortEntry = s => { const at = s.indexOf('@'); const path = at < 0 ? s : s.slice(0, at); return path.split('/').pop() + (at < 0 ? '' : '@' + s.slice(at + 1)); };
const getJson = async url => { try { return await (await fetch(url)).json(); } catch (e) { return null; } };
function kpi(label, value, sub, href, hot) {
  const inner = `<div class="l">${label}</div><div class="v">${value}</div>${sub ? `<div class="sub" title="${esc(sub)}">${esc(sub)}</div>` : ''}`;
  return href ? `<a class="stat ${hot ? 'hot' : ''}" href="${href}">${inner}</a>` : `<div class="stat ${hot ? 'hot' : ''}">${inner}</div>`;
}
function meter(label, pct, sub) {
  const k = pct >= 90 ? 'err' : pct >= 70 ? 'warn' : '';
  return `<div class="meter ${k}"><div class="mh"><span>${label}</span><span><b>${Math.round(pct)}%</b> 사용${sub ? ' · ' + esc(sub) : ''}</span></div><div class="bar"><i style="width:${Math.min(100, Math.max(0, pct))}%"></i></div></div>`;
}

async function loadHome() {
  const lo = window.LAST_OVERVIEW;                 // loadIssues 가 방금 받은 것이 있으면 다시 묻지 않는다
  const [ov, rs, us, pf, st, rt, wo, wr] = await Promise.all([lo && Date.now() - lo.at < 12000 ? lo.data : getJson('/api/agent/overview?limit=40'), getJson('/api/research?limit=30'), getJson('/api/usage'), getJson('/api/platform'), getJson('/api/status'), getJson('/api/routines'), getJson('/api/workspaces'), getJson('/api/workspaces/recent?limit=6')]);
  const wsList = (wo && wo.enabled && wo.workspaces) || [];
  const wsAsk = wsList.filter(w => w.waiting > 0);          // 실행 전 확인을 기다리는 작업 공간
  const wsRun = wsList.filter(w => w.runningThread);
  const sessions = (ov && ov.sessions) || [];
  const activeIds = (ov && ov.activeIds) || [];
  const waiting = sessions.filter(s => s.state === 'DESIGN_WAIT' || s.state === 'REVIEW_WAIT');
  const threads = (rs && rs.threads) || [];
  const rQueued = threads.filter(t => t.state === 'NEW').length;
  const ports = (pf && pf.ports) || [];
  const badPorts = ports.filter(p => p.status !== 'ok');
  const plan = us && us.plan; const w24 = us && us.windows && us.windows['24h'];

  // ---- KPI
  $('kpis').innerHTML =
      kpi('진행 중 이슈', `${activeIds.length}<small> / ${(ov && ov.concurrency) || 1}</small>`, ov && !ov.enabled ? '이슈 에이전트 비활성' : (ov && ov.nextRef ? '다음 대기 ' + ov.nextRef : (activeIds.length ? '작업 중' : '유휴')), '/agent.html')
    + kpi('확인 대기', `${waiting.length + wsAsk.length}<small> 건</small>`, waiting.length || wsAsk.length ? waiting.map(s => s.projectPath.split('/').pop() + '#' + s.issueIid).concat(wsAsk.map(w => w.name)).join(', ') : '내 확인을 기다리는 작업 없음',
        waiting.length ? '/agent.html#s=' + waiting[0].id : wsAsk.length ? `/workspace.html#w=${wsAsk[0].id}&t=${wsAsk[0].runningThread}` : '/agent.html', waiting.length + wsAsk.length > 0)
    + (wsList.length ? kpi('작업 공간', wsRun.length ? `${wsRun.length}<small> 작업 중</small>` : '유휴', `등록 ${wsList.length}개` + (wsRun.length ? ' · ' + wsRun.map(w => w.name).join(', ') : ''), wsRun.length ? `/workspace.html#w=${wsRun[0].id}&t=${wsRun[0].runningThread}` : '/workspace.html') : '')
    + kpi('리서치', rs && rs.runningId ? '조사 중' : (rQueued ? `대기 ${rQueued}` : '유휴'), `스레드 ${threads.length}개${rQueued && rs.runningId ? ' · 대기 ' + rQueued : ''}`, '/research.html')
    + kpi('연동', `${ports.length - badPorts.length}<small> / ${ports.length} 정상</small>`, badPorts.length ? badPorts.map(p => p.label).join(', ') + ' 확인 필요' : '메신저 · LLM · 지식', '/platform.html', badPorts.some(p => p.status === 'down'))
    + kpi('구독 사용률 (5시간)', plan && plan.fiveHour ? `${Math.round(plan.fiveHour.percent)}<small> %</small>` : (us && us.budget ? `${us.budget.usedPct}<small> % 추정</small>` : '—'), plan && plan.fiveHour ? '리셋 ' + (plan.fiveHour.resetsAtText || '') + (plan.stale ? ' · 이전 값' : '') : '구독 API 를 못 읽어 토큰 합계로 추정', null, plan && plan.fiveHour && plan.fiveHour.percent >= 90)
    + kpi('토큰 (24시간)', w24 ? `↑${kf(w24.in)} <small>↓${kf(w24.out)}</small>` : '—', w24 ? `Claude 호출 ${w24.calls}회` : '');

  // ---- 주의할 것
  const al = [];
  if (us && us.limit && us.limit.active) al.push(`<div class="callout err"><span class="ic">${I.warn}</span><span><b>Claude 사용량 한도</b> — 리셋(${esc(us.limit.untilText || '?')})까지 새 작업을 시작하지 않습니다. 대기열은 리셋 뒤 자동으로 이어집니다.</span></div>`);
  waiting.forEach(s => al.push(`<div class="callout warn"><span class="ic">${I.warn}</span><span><b>${esc(KOR[s.state] || s.state)}</b> · ${esc(s.projectPath.split('/').pop())}#${s.issueIid} ${esc(s.issueTitle || '')}</span><a href="/agent.html#s=${s.id}">${s.state === 'DESIGN_WAIT' ? '설계안 검토' : '변경 내용 검토'} ${I.arrow}</a></div>`));
  wsAsk.forEach(w => al.push(`<div class="callout warn"><span class="ic">${I.warn}</span><span><b>실행 전 확인 대기</b> · 작업 공간 ${esc(w.name)} — ${w.waiting}건(답이 없으면 40분 뒤 거부로 처리)</span><a href="/workspace.html#w=${w.id}&t=${w.runningThread}">확인하러 가기 ${I.arrow}</a></div>`));
  badPorts.forEach(p => al.push(`<div class="callout ${p.status === 'down' ? 'err' : 'warn'}"><span class="ic">${I.warn}</span><span><b>${esc(p.label)}</b> (${esc(p.provider)}) — ${esc(p.summary)}</span><a href="/platform.html">연동 확인 ${I.arrow}</a></div>`));
  $('alerts').innerHTML = al.join('');

  // ---- 질의
  $('homeResearch').innerHTML = threads.slice(0, 6).map(t => `<a class="rrow" href="/research.html#r=${t.id}">
      <span class="badge ${R_CLS[t.state] || 'gray'}">${R_KOR[t.state] || t.state}</span><span class="rp" title="${esc(t.projects.join(', '))}">${esc(t.projects.map(shortEntry).join(' + '))}</span>
      <span class="rq" title="${esc(t.question)}">${esc(t.question)}</span>${t.verifyState && R_VERIFY[t.verifyState] ? `<span class="rw">${R_VERIFY[t.verifyState]}</span>` : ''}<span class="rw">${ago(t.updatedAt)}</span></a>`).join('')
    || '<div class="md-empty">아직 리서치가 없습니다. 소스를 훑어 정리해 달라는 질문을 올려 보세요.</div>';
  // 루틴(예약 질의): 켜진 것 중 가장 먼저 돌 것 한 줄
  const routines = ((rt && rt.routines) || []).filter(r => r.enabled && r.nextRunAt).sort((a, b) => a.nextRunAt < b.nextRunAt ? -1 : 1);
  if (routines.length) $('homeResearch').innerHTML += `<a class="rrow" href="/research.html"><span class="badge info">루틴 ${routines.length}</span><span class="rq" title="${esc(routines.map(r => r.name).join(', '))}">다음 실행: ${esc(routines[0].name)}</span><span class="rw">${fmt(routines[0].nextRunAt)}</span></a>`;

  // ---- 작업 공간: 최근 대화(등록된 것이 없으면 카드를 숨긴다)
  $('homeWsCard').style.display = wsList.length ? '' : 'none';
  if (wsList.length) {
    const cutq = s => String(s || '').replace(/\s+/g, ' ').trim();
    $('homeWorkspace').innerHTML = (Array.isArray(wr) ? wr : []).map(t => `<a class="rrow" href="/workspace.html#w=${t.workspaceId}&t=${t.id}">
        <span class="badge ${R_CLS[t.state] || 'gray'}">${W_KOR[t.state] || t.state}</span><span class="rp" title="${esc(t.workspace)}">${esc(t.workspace)}</span>
        <span class="rq" title="${esc(cutq(t.title).slice(0, 300))}">${esc(cutq(t.title).slice(0, 160))}</span><span class="rw">${ago(t.updatedAt)}</span></a>`).join('')
      || '<div class="md-empty">아직 대화가 없습니다. 작업 공간에서 할 일을 적어 보내 보세요.</div>';
  }

  // ---- 연동 상태
  $('homePorts').innerHTML = ports.map(p => { const b = P_BADGE[p.status] || ['gray', p.status]; return `<div class="prow"><span class="badge ${b[0]}">${b[1]}</span><b>${esc(p.label)}</b><span class="pv">${esc(p.provider)}</span><span class="ps" title="${esc(p.summary)}">${esc(p.summary)}</span></div>`; }).join('')
    || '<div class="md-empty">상태 조회 실패</div>';

  // ---- 사용량
  if (us) {
    $('usageSrc').textContent = plan ? (plan.stale ? '구독 사용률(이전 값 — API 재시도 대기)' : '구독 사용률(실제값)') : '토큰 집계 추정(실제와 다를 수 있음)';
    const hourly = us.hourly24h || []; const hmax = Math.max(1, ...hourly);
    $('homeUsage').innerHTML =
        (plan && plan.fiveHour ? meter('5시간 창', plan.fiveHour.percent, '리셋 ' + (plan.fiveHour.resetsAtText || '')) : (us.budget ? meter('5시간 창(추정)', us.budget.usedPct, '') : ''))
      + (plan && plan.sevenDay ? meter('7일 창', plan.sevenDay.percent, '리셋 ' + (plan.sevenDay.resetsAtText || '')) : '')
      + `<div class="hours" title="최근 24시간 시간대별 토큰">${hourly.map((v, i) => `<i class="${i === hourly.length - 1 ? 'now' : ''}" style="height:${Math.round(v / hmax * 100)}%" title="${kf(v)}"></i>`).join('')}</div>`
      + `<div class="ulist">${(us.byModel24h || []).map(m => `<span><b class="m-${esc(m.model)}">${esc(m.model)}</b> ↑${kf(m.in)} ↓${kf(m.out)} · ${m.calls}회</span>`).join('') || '<span>최근 24시간 호출 없음</span>'}</div>`
      + `<div class="ulist">${(us.bySource24h || []).map(m => `<span><b>${esc(SRC_KO[m.source] || m.source)}</b> ${m.calls}회 · ↑${kf(m.in)}</span>`).join('')}</div>`;
  } else $('homeUsage').innerHTML = '<div class="md-empty">사용량 조회 실패</div>';

  // ---- 메신저
  $('homeMessenger').innerHTML = st ? `<div class="mini3">${stat('수집 메시지', num(st.messages), '건')}${stat('요약', num(st.summaries), '건')}${stat('멘션 처리', num(st.mentions), '건')}</div>
      <div class="ulist"><span><b>수집</b> ${esc(st.collectMode)}</span><span><b>멘션</b> ${esc(st.mentionMode)}</span></div>` : '<div class="md-empty">상태 조회 실패</div>';
}

loadIssues().then(loadHome);
UI.every(loadIssues, 10000); UI.every(loadHome, 20000);
</script>
</body>
</html>
