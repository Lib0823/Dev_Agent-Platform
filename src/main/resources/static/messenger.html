<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메신저 · Dev Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%236d5dfc%27/%3E%3Cpath d=%27M9 11h14M9 16h10M9 21h7%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/admin.css">
<style>
  .grid.two { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  @media (max-width: 1100px) { .grid.two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header id="topbar"></header>

  <div class="wrap">
    <section class="stats hero" id="stats">
      <div class="stat"><div class="l">수집 메시지</div><div class="v"><div class="skel" style="width:60%"></div></div></div>
      <div class="stat"><div class="l">요약</div><div class="v"><div class="skel" style="width:40%"></div></div></div>
      <div class="stat"><div class="l">멘션 처리</div><div class="v"><div class="skel" style="width:40%"></div></div></div>
      <div class="stat"><div class="l">수집 모드</div><div class="v"><div class="skel" style="width:50%"></div></div></div>
      <div class="stat"><div class="l">멘션 모드</div><div class="v"><div class="skel" style="width:70%"></div></div></div>
    </section>

    <div class="grid two">
      <div class="col">
        <section class="card">
          <h2><span class="ic" id="icRooms"></span>방 설정<span class="sp"></span><span class="hint" id="roomsCount"></span></h2>
          <div class="hint" style="margin-bottom:12px">
            <b>수집</b> = 그 방 메시지를 가져와 @AI·멘션을 감지합니다. 수집만 켜면 답은 <b>내 자기방</b>으로 갑니다.<br>
            <b>방에 직접 답</b> = 답을 <b>그 방</b>에 올립니다(자동응답/@AI). 켜면 수집은 자동 포함됩니다.
          </div>
          <div class="toolbar">
            <div class="field has-ico"><span class="ico" id="icSearch"></span><input id="filter" placeholder="방 이름 검색…" autocomplete="off"></div>
            <button class="btn" onclick="loadRooms()" id="roomsRefresh">새로고침</button>
            <button class="btn primary" id="saveBtn" onclick="save()">저장</button>
          </div>
          <div class="rhead"><span>방</span><span>수집</span><span>방에 직접 답</span></div>
          <div class="rlist" id="rooms"><div class="skel" style="margin:12px 10px"></div><div class="skel" style="margin:12px 10px;width:70%"></div><div class="skel" style="margin:12px 10px;width:85%"></div></div>
          <div class="callout warn" style="margin-top:12px"><span class="ic" id="icWarn"></span><span><b>그룹방 "방에 직접 답"</b>을 켜면 그 방 모든 멤버에게 봇이 자동으로 글을 올립니다. 민감 요청(결재·승인 등)은 자동응답 대신 자기방 초안으로만 갑니다.</span></div>
        </section>
      </div>
      <div class="col">
        <section class="card">
          <h2><span class="ic" id="icClock"></span>최근 활동<span class="sp"></span>
            <div class="seg"><button class="tab sel" data-r="sum">요약</button><button class="tab" data-r="men">멘션 처리</button></div></h2>
          <div class="pane sel" id="r-sum"><div class="md-empty">불러오는 중…</div></div>
          <div class="pane" id="r-men"></div>
        </section>
      </div>
    </div>
  </div>
</div>
<div class="toasts" id="toasts"></div>

<script src="/ui.js"></script>
<script src="/admin.js"></script>
<script>
UI.topbar('messenger', '메신저');
UI.pollAgentChip();
loadStatus(); loadRooms(); loadRecent();
UI.every(loadStatus, 15000); UI.every(loadRecent, 60000);
</script>
</body>
</html>
