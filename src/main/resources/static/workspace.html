<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mb-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 공간 · Dev Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%236d5dfc%27/%3E%3Cpath d=%27M9 11h14M9 16h10M9 21h7%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
  /* ---------- layout: 왼쪽 작업 공간·대화 목록, 오른쪽 대화(화면 높이에 맞춰 안에서만 스크롤) ---------- */
  .body { display: grid; grid-template-columns: var(--side-w, 320px) minmax(0, 1fr); gap: 18px; padding: 18px 22px 48px; flex: 1; }
  .wside { padding: 14px; position: sticky; top: 78px; height: calc(100vh - 96px); display: flex; flex-direction: column; gap: 12px; }
  .wmain { position: sticky; top: 78px; height: calc(100vh - 96px); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  @media (max-width: 980px) { .body { grid-template-columns: 1fr; } .wside { position: static; height: auto; max-height: 46vh; } .wmain { position: static; height: 78vh; } }

  /* ---------- sidebar ---------- */
  .wside .btn.add { justify-content: center; }
  .wlist { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; overscroll-behavior: contain; scrollbar-gutter: stable; }
  .wsp { border-radius: 12px; border: 1px solid transparent; }
  .wsp.sel { background: var(--surface2); border-color: var(--line2); }
  .wsp .wh { display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 12px; cursor: pointer; border-radius: 12px; }
  .wsp:not(.sel) .wh:hover { background: var(--surface2); }
  .wsp .wn { flex: 1; min-width: 0; }
  .wsp .wn b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsp .wn span { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .wsp .wdot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: blink 1.2s infinite; flex: none; }
  .wsp .wgear { width: 26px; height: 26px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; opacity: 0; }
  .wsp .wh:hover .wgear, .wsp.sel .wgear { opacity: 1; }
  .wsp .wgear:hover { background: var(--raised); color: var(--text); }
  .wsp.gone .wn b { color: var(--err); }
  .wths { padding: 0 6px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .wth { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--text2); }
  .wth:hover { background: var(--raised); color: var(--text); }
  .wth.sel { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent) inset; }
  .wth .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wth .tw { color: var(--muted); font-size: 11px; font-weight: 400; flex: none; }
  .wth .ts { width: 6px; height: 6px; border-radius: 50%; background: var(--line2); flex: none; }
  .wth .ts.run { background: var(--run); animation: blink 1.2s infinite; } .wth .ts.err { background: var(--err); } .wth .ts.ok { background: var(--ok); }
  .wth.new { color: var(--muted); } .wth.new svg { width: 13px; height: 13px; }
  .wnone { color: var(--muted); font-size: 12.5px; line-height: 1.7; padding: 16px 8px; text-align: center; }

  /* ---------- main: head / chat / input ---------- */
  .whead { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  .whead .wt { min-width: 0; flex: 1; }
  .whead .wt b { font-size: 15px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whead .wt span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whead select.in { width: auto; height: 32px; font-size: 12.5px; flex: none; }
  .wchat { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
  .wq { display: flex; justify-content: flex-end; flex: none; }
  .wq .bub { max-width: 78%; background: var(--accent); color: var(--accent-ink); padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.55; }
  .wa { flex: none; min-width: 0; max-width: 1100px; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 12px 16px; }
  .wa.bad { border-color: color-mix(in srgb, var(--err) 35%, transparent); }
  .wa .md { font-size: 14px; line-height: 1.7; max-width: none; word-break: break-word; }
  .wa .md > :first-child { margin-top: 0; } .wa .md > :last-child { margin-bottom: 0; }
  .wa .md table { border-collapse: collapse; font-size: 13px; margin: 6px 0 10px; display: block; overflow-x: auto; max-width: 100%; }
  .wa .md th, .wa .md td { border: 1px solid var(--line2); padding: 4px 9px; text-align: left; vertical-align: top; }
  .wa .md th { background: var(--raised); font-weight: 600; }
  .wa .werr { color: var(--err); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .wa .wmeta { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .wa.live { border-color: color-mix(in srgb, var(--run) 35%, transparent); background: var(--runbg); }
  .wa .wlh { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .wa .wlh .mm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .wa .wlh .sp { flex: 1; }
  .wspin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--run) 30%, transparent); border-top-color: var(--run); animation: wspin .8s linear infinite; flex: none; }
  @keyframes wspin { to { transform: rotate(360deg); } }
  .wlog { margin-top: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.75; color: var(--text2); }
  .wlog:empty { display: none; }
  .wlog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wlog div.t { color: var(--text); font-family: var(--font); font-size: 13px; white-space: normal; }
  .wlog div.e { color: var(--err); }
  .wempty { margin: auto; max-width: 560px; text-align: center; color: var(--text2); font-size: 13.5px; line-height: 1.75; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .wempty > b { font-size: 16px; color: var(--text); }
  .wempty .wic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .wempty .wic svg { width: 22px; height: 22px; }
  .whints { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
  .whints .chip { cursor: pointer; font-weight: 500; }
  .whints .chip:hover { border-color: var(--accent); color: var(--text); }
  .winput { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .winput textarea.in { min-height: 56px; max-height: 240px; resize: none; font-size: 14px; line-height: 1.5; }
  .winput .btn { height: 56px; width: 54px; justify-content: center; padding: 0; flex: none; }
  .wwarn { flex: none; margin: 10px 16px 0; }

  /* ---------- 등록·설정 창 ---------- */
  dialog.wdlg { width: min(600px, calc(100vw - 32px)); padding: 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  dialog.wdlg::backdrop { background: rgba(0,0,0,.45); }
  dialog.wdlg h3 { margin: 0 0 4px; font-size: 16px; }
  dialog.wdlg .sub { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 0 0 10px; }
  dialog.wdlg label.l { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  dialog.wdlg input.mono { font-family: var(--mono); font-size: 12.5px; }
  .wmodes { display: flex; flex-direction: column; gap: 6px; }
  .wmodes label { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; }
  .wmodes label:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent) inset; }
  .wmodes input { accent-color: var(--accent); margin-top: 3px; }
  .wmodes b { font-size: 13.5px; } .wmodes span { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
  dialog.wdlg .chk { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--text2); line-height: 1.5; }
  dialog.wdlg .chk input { accent-color: var(--accent); margin-top: 3px; }
  dialog.wdlg .btns { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  dialog.wdlg .btns .sp { flex: 1; }
  dialog.wdlg .derr { color: var(--err); font-size: 12.5px; margin-top: 10px; white-space: pre-wrap; }
  dialog.wdlg .derr:empty { display: none; }
</style>
</head>
<body>
<div class="app">
  <header id="topbar"></header>

  <div class="body">
    <aside class="panel-card wside">
      <button class="btn add" id="btnAdd" onclick="openDlg(null)" title="작업할 폴더를 등록합니다"></button>
      <div class="sec"><span>작업 공간<span class="n" id="wcount">0</span></span></div>
      <div class="wlist" id="wlist"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
    </aside>

    <main class="panel-card wmain" id="main">
      <div class="whead" id="whead" style="display:none">
        <div class="wt"><b id="hName"></b><span id="hPath"></span></div>
        <span class="badge" id="hMode"></span>
        <select class="in" id="wModel" title="이 요청에 쓸 모델"></select>
      </div>
      <div class="callout warn wwarn" id="wWarn" style="display:none"></div>
      <div class="wchat" id="wchat"></div>
      <div class="winput" id="winput" style="display:none">
        <textarea class="in" id="wIn" rows="2" placeholder="이 폴더에서 할 일을 적으세요. 예) 3장 실험 결과 표를 최신 로그로 다시 채워 줘   (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
        <button class="btn primary" id="wSend" onclick="send()" title="보내기 (Enter)"></button>
      </div>
    </main>
  </div>
</div>

<dialog class="wdlg" id="wDlg">
  <h3 id="dTitle">작업 공간 추가</h3>
  <p class="sub">이 PC 의 폴더를 등록하면, 그 폴더를 작업 디렉터리로 한 Claude 세션과 대화하며 일할 수 있습니다. 코드 저장소가 아니어도 됩니다(논문·문서·실험 폴더).</p>
  <label class="l" for="dPath">폴더 경로</label>
  <input class="in mono" id="dPath" autocomplete="off" spellcheck="false" placeholder="예) C:\Users\me\papers\my-paper   또는   /home/me/projects/app">
  <label class="l" for="dName">이름 <span style="font-weight:400">(비우면 폴더 이름)</span></label>
  <input class="in" id="dName" maxlength="80" autocomplete="off">
  <label class="l">권한 — 세션이 이 폴더에서 할 수 있는 일</label>
  <div class="wmodes">
    <label><input type="radio" name="dMode" value="full"><div><b>편집 + 실행</b><span>파일을 고치고 명령(빌드·테스트·스크립트·실험·git)을 돌립니다. 건별 승인 없이 진행되니 믿을 수 있는 폴더에만.</span></div></label>
    <label><input type="radio" name="dMode" value="edit"><div><b>편집만</b><span>파일은 고치지만 명령은 실행하지 않습니다. 문서·논문 작업에 알맞습니다.</span></div></label>
    <label><input type="radio" name="dMode" value="read"><div><b>읽기만</b><span>읽고 찾아서 답하기만 합니다. 아무것도 바꾸지 않습니다.</span></div></label>
  </div>
  <label class="chk" id="dMcpRow"><input type="checkbox" id="dMcp"> <span>운영 MCP 도구 사용 — 플랫폼 탭에 등록된 운영 데이터 조회 도구(읽기 전용)를 이 작업 공간의 세션에도 싣습니다. 서버·인프라 작업용.</span></label>
  <div class="derr" id="dErr"></div>
  <div class="btns">
    <button class="btn danger" id="dDel" onclick="removeWs()" title="등록만 해제합니다 — 폴더와 파일은 그대로 둡니다">등록 해제</button>
    <span class="sp"></span>
    <button class="btn" onclick="$('wDlg').close()">취소</button>
    <button class="btn primary" id="dSave" onclick="saveWs()">저장</button>
  </div>
</dialog>
<div class="toasts" id="toasts"></div>

<script src="/ui.js"></script>
<script>
const { $, esc, fmt, ago, dur, I, toast } = UI;
UI.topbar('workspace', '작업 공간');
UI.splitter('workspace', 320);
UI.pollAgentChip();
$('btnAdd').innerHTML = I.plus + '작업 공간 추가';
$('wSend').innerHTML = I.send;

const MODE_KO = { full: '편집 + 실행', edit: '편집만', read: '읽기만' };
const MODE_CLS = { full: 'run', edit: 'info', read: 'gray' };
const STATE_KO = { DONE: '완료', FAILED: '실패', ABORTED: '중단됨' };
const HINTS = ['이 폴더가 어떤 구조인지 훑어보고 요약해 줘', '최근에 바뀐 내용을 정리해 줘', 'README 를 읽고 실행 방법을 알려 줘'];
const GEAR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

// 상태: 고른 작업 공간(sel)·대화(thread, null = 새 대화)와 그 대화의 차례·활동 로그
const st = { info: null, list: [], sel: null, threads: [], thread: null, turns: [], events: [], lastEv: 0, liveId: 0, running: null, sending: false, editId: null };
const getJ = async u => (await fetch(u, { cache: 'no-store' })).json();
const postJ = async (u, body) => (await fetch(u, { method: 'POST', body: new URLSearchParams(body || {}) })).json();
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) {} return null; };
const cur = () => st.list.find(w => w.id === st.sel) || null;
const live = () => { const t = st.turns[st.turns.length - 1]; return !!t && (t.state === 'NEW' || t.state === 'RUNNING'); };
const cut = (s, n) => { const t = String(s || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
const hashGet = () => { const m = /w=(\d+)/.exec(location.hash), t = /t=(\d+)/.exec(location.hash); return { w: m ? Number(m[1]) : null, t: t ? Number(t[1]) : null }; };
const hashSet = () => history.replaceState(null, '', st.sel ? '#w=' + st.sel + (st.thread ? '&t=' + st.thread : '') : location.pathname);

// ---------------------------------------------------------------- 목록
async function loadOverview() {
  let d; try { d = await getJ('/api/workspaces'); } catch (_) { return; }
  st.info = d; st.list = d.workspaces || [];
  if (!d.enabled) { $('wlist').innerHTML = `<div class="wnone">작업 공간이 꺼져 있습니다.<br>${esc(d.reason || '')}</div>`; $('btnAdd').disabled = true; renderMain(); return; }
  const ms = $('wModel'), keep = ms.value || ls('ws.model') || '';
  UI.set(ms, `<option value="">기본 (${esc(d.defaultModel || '')})</option>` + (d.models || []).map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join(''));
  ms.value = (d.models || []).includes(keep) ? keep : '';
  if (st.sel != null && !cur()) { st.sel = null; st.thread = null; st.turns = []; }
  if (st.sel == null && st.list.length) {
    const h = hashGet(), want = h.w || Number(ls('ws.sel')) || null;
    const w = st.list.find(x => x.id === want) || st.list[0];
    selectWs(w.id, h.w === w.id && h.t ? h.t : undefined); return;
  }
  renderList(); renderMain();
}
function renderList() {
  $('wcount').textContent = st.list.length;
  if (!st.list.length) { UI.set($('wlist'), '<div class="wnone">등록된 작업 공간이 없습니다.<br>위의 「작업 공간 추가」로 폴더를 등록하세요.</div>'); return; }
  UI.set($('wlist'), st.list.map(w => {
    const sel = w.id === st.sel;
    let h = `<div class="wsp${sel ? ' sel' : ''}${w.exists ? '' : ' gone'}"><div class="wh" onclick="selectWs(${w.id})" title="${esc(w.path)}${w.exists ? '' : '\n폴더가 없습니다'}">
      <div class="wn"><b>${esc(w.name)}</b><span>&lrm;${esc(w.path)}</span></div>${w.runningThread ? '<span class="wdot" title="작업 중"></span>' : ''}
      <button class="wgear" onclick="event.stopPropagation();openDlg(${w.id})" title="설정">${GEAR}</button></div>`;
    if (sel) {
      h += `<div class="wths"><div class="wth new${st.thread == null ? ' sel' : ''}" onclick="selectThread(null)">${I.plus}<span class="tt">새 대화</span></div>`
        + st.threads.map(t => `<div class="wth${t.id === st.thread ? ' sel' : ''}" onclick="selectThread(${t.id})" title="${esc(cut(t.title, 300))}">
            <span class="ts ${t.state === 'RUNNING' || t.state === 'NEW' ? 'run' : t.state === 'DONE' ? 'ok' : 'err'}"></span><span class="tt">${esc(cut(t.title, 60))}</span><span class="tw">${ago(t.updatedAt)}</span></div>`).join('')
        + '</div>';
    }
    return h + '</div>';
  }).join(''));
}
async function loadThreads() {
  const id = st.sel; if (id == null) return;
  let d; try { d = await getJ('/api/workspaces/' + id + '/threads'); } catch (_) { return; }
  if (id !== st.sel) return;
  st.threads = Array.isArray(d) ? d : [];
  renderList();
}
/** 작업 공간 선택. threadId 를 주지 않으면 실행 중인 대화 → 마지막으로 보던 대화 → 가장 최근 대화 순으로 연다. */
async function selectWs(id, threadId) {
  if (st.sel !== id) { st.sel = id; st.threads = []; st.thread = null; resetThread(); }
  ls('ws.sel', String(id));
  renderList(); renderMain();
  await loadThreads();
  if (id !== st.sel) return;
  const w = cur(), has = t => st.threads.some(x => x.id === t);
  let t = threadId !== undefined ? threadId : (w && w.runningThread) || Number(ls('ws.thread.' + id)) || (st.threads[0] && st.threads[0].id) || null;
  selectThread(t != null && has(t) ? t : null);
}
function resetThread() { st.turns = []; st.events = []; st.lastEv = 0; st.liveId = 0; st.running = null; }
function selectThread(id) {
  st.thread = id; resetThread();
  if (st.sel != null) ls('ws.thread.' + st.sel, id ? String(id) : null);
  hashSet(); renderList(); renderMain();
  if (id) loadThread(false).then(() => { const b = $('wchat'); b.scrollTop = b.scrollHeight; });
  $('wIn').focus();
}
window.addEventListener('hashchange', () => { const h = hashGet(); if (h.w && (h.w !== st.sel || (h.t || null) !== st.thread) && st.list.some(w => w.id === h.w)) selectWs(h.w, h.t); });

// ---------------------------------------------------------------- 대화
async function loadThread(inc) {
  const id = st.thread; if (!id) return;
  let d; try { d = await getJ('/api/workspaces/threads/' + id + '?afterId=' + (inc ? st.lastEv : 0)); } catch (_) { return; }
  if (id !== st.thread) return;                     // 그 사이 다른 대화로 옮겼다
  const was = live();
  if (!inc || d.liveId !== st.liveId) { st.events = []; if (!inc) st.lastEv = 0; }
  st.turns = d.turns || []; st.liveId = d.liveId; st.running = d.running || null;
  for (const e of d.events || []) { if (e.id > st.lastEv || !inc) { st.events.push(e); st.lastEv = Math.max(st.lastEv, e.id); } }
  if (st.events.length > 400) st.events = st.events.slice(-400);
  renderMain();
  if (was && !live()) { loadOverview(); loadThreads(); }   // 방금 끝났다: 목록의 상태 갱신
}
function renderMain() {
  const w = cur(), b = $('wchat');
  $('whead').style.display = w ? '' : 'none'; $('winput').style.display = w ? '' : 'none';
  const warn = $('wWarn');
  if (!w) {
    warn.style.display = 'none';
    const off = st.info && !st.info.enabled;
    UI.set(b, `<div class="wempty"><div class="wic">${I.terminal}</div><b>작업 공간</b>
      <div>${off ? '작업 공간이 꺼져 있습니다.' : '폴더를 등록하면 그 폴더에서 Claude 세션과 대화하며 일할 수 있습니다 — 파일 수정, 명령·실험 실행, 질문.<br>이슈를 만들지 않고 바로 소통하며 처리하는 길이고, 대화는 작업 공간마다 따로 이어집니다.'}</div>
      ${off ? '' : `<button class="btn primary" onclick="openDlg(null)">${I.plus}작업 공간 추가</button>`}</div>`);
    return;
  }
  $('hName').textContent = w.name; $('hPath').textContent = w.path;
  const hm = $('hMode'); hm.textContent = MODE_KO[w.mode] || w.mode; hm.className = 'badge ' + (MODE_CLS[w.mode] || '');
  hm.title = '이 작업 공간의 권한' + (w.opsMcp ? ' · 운영 MCP 사용' : '') + ' — 왼쪽 목록의 톱니바퀴에서 바꿉니다';
  const lim = st.info && st.info.limited;
  if (!w.exists) { warn.style.display = 'flex'; warn.innerHTML = `<span class="ic">${I.warn}</span><span>폴더가 없습니다: <b>${esc(w.path)}</b> — 옮겼다면 설정(톱니바퀴)에서 경로를 고치세요.</span>`; }
  else if (lim) { warn.style.display = 'flex'; warn.innerHTML = `<span class="ic">${I.warn}</span><span>Claude 사용량 한도에 걸려 있습니다${st.info.limitUntil ? ' (리셋 ' + esc(st.info.limitUntil) + ')' : ''}. 리셋 뒤에 보낼 수 있습니다.</span>`; }
  else warn.style.display = 'none';

  const stick = b.scrollHeight - b.scrollTop - b.clientHeight < 90;
  let h = '';
  if (!st.turns.length) {
    h = st.thread ? '<div class="wempty"><div>불러오는 중…</div></div>'
      : `<div class="wempty"><div class="wic">${I.terminal}</div><b>${esc(w.name)}</b>
        <div>이 폴더에서 할 일을 적으면 세션이 바로 시작합니다. 같은 대화는 맥락을 이어 가고, 왼쪽의 「새 대화」는 새 세션으로 시작합니다.<br>
        권한: <b>${MODE_KO[w.mode] || esc(w.mode)}</b>${w.mode === 'full' ? ' — 파일 수정과 명령 실행이 건별 승인 없이 진행됩니다.' : ''}</div>
        <div class="whints">${HINTS.map(x => `<button class="chip" onclick="hint(this)">${esc(x)}</button>`).join('')}</div></div>`;
  }
  for (const t of st.turns) {
    h += `<div class="wq"><div class="bub">${esc(t.question)}</div></div>`;
    if (t.state === 'NEW' || t.state === 'RUNNING') {
      const since = t.startedAt ? dur(Date.now() - new Date(t.startedAt).getTime()) : '';
      const log = st.events.filter(e => e.kind !== 'STATE' && e.kind !== 'TOOL_RESULT').slice(-14).map(e =>
        `<div class="${e.kind === 'ERROR' ? 'e' : e.kind === 'TEXT' ? 't' : ''}">${e.kind === 'TOOL' ? '▸ ' : ''}${esc(e.message || '')}</div>`).join('');
      h += `<div class="wa live"><div class="wlh"><span class="wspin"></span><b>${t.state === 'NEW' ? '시작하는 중…' : '작업 중'}</b>
        <span class="mm">${since}${st.running ? ' · ' + esc(st.running.model || '') : ''}</span><span class="sp"></span>
        <button class="btn sm danger" onclick="abortTurn(${t.id})">중단</button></div><div class="wlog">${log}</div></div>`;
    } else {
      const bad = t.state !== 'DONE';
      h += `<div class="wa ${bad ? 'bad' : ''}">${t.answerMd ? `<div class="md">${UI.mdLite(t.answerMd)}</div>` : ''}
        ${t.lastError ? `<div class="werr">${esc(t.lastError)}</div>` : ''}
        <div class="wmeta">${bad ? `<span class="badge ${t.state === 'ABORTED' ? 'wait' : 'err'}">${STATE_KO[t.state] || esc(t.state)}</span> ` : ''}${t.turns ? t.turns + '턴 · ' : ''}${t.elapsedMs ? dur(t.elapsedMs) + ' · ' : ''}${t.model ? esc(t.model) + ' · ' : ''}${fmt(t.finishedAt || t.createdAt)}</div></div>`;
    }
  }
  UI.set(b, h);
  if (stick) b.scrollTop = b.scrollHeight;
  $('wSend').disabled = live() || st.sending || !w.exists;
}
function hint(el) { $('wIn').value = el.textContent; $('wIn').focus(); }

async function send() {
  const w = cur(), inp = $('wIn'), q = inp.value.trim(); if (!w || !q || st.sending) return;
  if (live()) { toast('앞선 요청을 처리하는 중입니다. 끝난 뒤(또는 중단한 뒤) 보내세요.', 'warn'); return; }
  st.sending = true; $('wSend').disabled = true;
  try {
    const body = { question: q, model: $('wModel').value }; if (st.thread) body.threadId = st.thread;
    const r = await postJ('/api/workspaces/' + w.id + '/ask', body);
    if (!r.ok) { toast(r.result || '요청을 접수하지 못했습니다.', 'err'); return; }
    inp.value = ''; grow();
    st.thread = r.threadId; ls('ws.thread.' + w.id, String(r.threadId)); hashSet();
    await loadThread(false);
    const b = $('wchat'); b.scrollTop = b.scrollHeight;
    loadOverview(); loadThreads();
  } catch (e) { toast('요청을 보내지 못했습니다: ' + (e && e.message || e), 'err'); }
  finally { st.sending = false; renderMain(); }
}
async function abortTurn(id) {
  if (!confirm('진행 중인 작업을 중단할까요?\n그때까지 고친 내용은 폴더에 그대로 남습니다.')) return;
  try { const r = await postJ('/api/workspaces/turns/' + id + '/abort'); toast(r.result, r.ok ? '' : 'err'); } catch (e) { toast('중단 요청 실패', 'err'); }
  loadThread(true);
}
function grow() { const t = $('wIn'); t.style.height = 'auto'; t.style.height = Math.min(240, Math.max(56, t.scrollHeight + 2)) + 'px'; }
$('wIn').addEventListener('input', grow);
$('wIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('wModel').addEventListener('change', e => ls('ws.model', e.target.value || null));

// ---------------------------------------------------------------- 등록·설정
function openDlg(id) {
  const w = id == null ? null : st.list.find(x => x.id === id);
  st.editId = w ? w.id : null;
  $('dTitle').textContent = w ? '작업 공간 설정' : '작업 공간 추가';
  $('dPath').value = w ? w.path : ''; $('dName').value = w ? w.name : '';
  document.querySelectorAll('input[name="dMode"]').forEach(r => { r.checked = r.value === (w ? w.mode : 'full'); });
  $('dMcp').checked = !!(w && w.opsMcp);
  $('dMcpRow').style.display = st.info && st.info.mcpAvailable ? '' : 'none';
  $('dDel').style.display = w ? '' : 'none';
  $('dErr').textContent = '';
  $('wDlg').showModal(); $('dPath').focus();
}
async function saveWs() {
  const mode = (document.querySelector('input[name="dMode"]:checked') || {}).value || 'full';
  const body = { path: $('dPath').value, name: $('dName').value, mode, opsMcp: $('dMcp').checked ? 'true' : 'false' };
  if (st.editId != null) body.id = st.editId;
  $('dSave').disabled = true;
  try {
    const r = await postJ('/api/workspaces', body);
    if (!r.ok) { $('dErr').textContent = r.result || '저장하지 못했습니다.'; return; }
    $('wDlg').close(); toast(r.result, 'ok');
    const isNew = st.editId == null;
    await loadOverview();
    if (isNew) selectWs(r.id, null);
  } catch (e) { $('dErr').textContent = '저장 요청 실패: ' + (e && e.message || e); }
  finally { $('dSave').disabled = false; }
}
async function removeWs() {
  const w = st.list.find(x => x.id === st.editId); if (!w) return;
  if (!confirm(`「${w.name}」 작업 공간의 등록을 해제할까요?\n이 작업 공간의 대화 기록이 지워집니다. 폴더와 파일은 그대로 남습니다.`)) return;
  try {
    const r = await postJ('/api/workspaces/' + w.id + '/delete');
    if (!r.ok) { $('dErr').textContent = r.result; return; }
    $('wDlg').close(); toast(r.result, 'ok'); ls('ws.thread.' + w.id, null);
    if (st.sel === w.id) { st.sel = null; st.thread = null; st.threads = []; resetThread(); hashSet(); }
    loadOverview();
  } catch (e) { $('dErr').textContent = '요청 실패'; }
}
$('dPath').addEventListener('input', () => { $('dErr').textContent = ''; });
$('dPath').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveWs(); } });
$('dName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveWs(); } });

// ---------------------------------------------------------------- 갱신: 진행 중이면 2초마다 대화만, 목록은 15초마다(가려진 탭은 쉰다)
loadOverview();
UI.every(() => { loadOverview(); if (!live()) loadThreads(); }, 15000);
setInterval(() => { if (!UI.asleep() && live()) loadThread(true); }, 2000);
</script>
</body>
</html>
