<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mb-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 공간 · Dev Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%236d5dfc%27/%3E%3Cpath d=%27M9 11h14M9 16h10M9 21h7%27 stroke=%27white%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/ui.css">
<style>
  /* ---------- layout: 왼쪽 작업 공간·대화 목록, 오른쪽 대화(화면 높이에 맞춰 안에서만 스크롤) ---------- */
  .body { display: grid; grid-template-columns: var(--side-w, 320px) minmax(0, 1fr); gap: 18px; padding: 18px 22px 48px; flex: 1; }
  .wside { padding: 14px; position: sticky; top: 78px; height: calc(100vh - 96px); display: flex; flex-direction: column; gap: 12px; }
  .wmain { position: sticky; top: 78px; height: calc(100vh - 96px); display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); min-width: 0; overflow: hidden; }
  .wmain.files { grid-template-columns: minmax(360px, 1fr) minmax(0, 1.4fr); }
  .wcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .wfiles { display: none; flex-direction: column; min-width: 0; min-height: 0; border-left: 1px solid var(--line); }
  .wmain.files .wfiles { display: flex; }
  @media (max-width: 1300px) { .wmain.files { grid-template-columns: minmax(0, 1fr); } .wmain.files .wcol { display: none; } .wfiles { border-left: 0; } }
  @media (max-width: 980px) { .body { grid-template-columns: 1fr; } .wside { position: static; height: auto; max-height: 46vh; } .wmain { position: static; height: 78vh; } }

  /* ---------- sidebar ---------- */
  .wside .btn.add { justify-content: center; }
  .wlist { overflow: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; padding-right: 2px; overscroll-behavior: contain; scrollbar-gutter: stable; }
  .wsp { border-radius: 12px; border: 1px solid transparent; }
  .wsp.sel { background: var(--surface2); border-color: var(--line2); }
  .wsp .wh { display: flex; align-items: center; gap: 8px; padding: 9px 8px 9px 12px; cursor: pointer; border-radius: 12px; }
  .wsp:not(.sel) .wh:hover { background: var(--surface2); }
  .wsp .wn { flex: 1; min-width: 0; }
  .wsp .wn b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wsp .wn span { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .wsp .wdot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: blink 1.2s infinite; flex: none; }
  .wsp .wgear { width: 26px; height: 26px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; opacity: 0; }
  .wsp .wh:hover .wgear, .wsp.sel .wgear { opacity: 1; }
  .wsp .wgear:hover { background: var(--raised); color: var(--text); }
  .wsp.gone .wn b { color: var(--err); }
  .wths { padding: 0 6px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .wth { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--text2); }
  .wth:hover { background: var(--raised); color: var(--text); }
  .wth.sel { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent) inset; }
  .wth .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wth .tw { color: var(--muted); font-size: 11px; font-weight: 400; flex: none; }
  .wth .ts { width: 6px; height: 6px; border-radius: 50%; background: var(--line2); flex: none; }
  .wth .ts.run { background: var(--run); animation: blink 1.2s infinite; } .wth .ts.err { background: var(--err); } .wth .ts.ok { background: var(--ok); }
  .wth.new { color: var(--muted); } .wth.new svg { width: 13px; height: 13px; }
  .wnone { color: var(--muted); font-size: 12.5px; line-height: 1.7; padding: 16px 8px; text-align: center; }

  /* ---------- main: head / chat / input ---------- */
  .whead { flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  .whead .wt { min-width: 0; flex: 1; }
  .whead .wt b { font-size: 15px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whead .wt span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .whead select.in { width: auto; height: 32px; font-size: 12.5px; flex: none; }
  .wchat { flex: 1; min-height: 0; overflow: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
  .wq { display: flex; justify-content: flex-end; flex: none; }
  .wq .bub { max-width: 78%; background: var(--accent); color: var(--accent-ink); padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; word-break: break-word; font-size: 14px; line-height: 1.55; }
  .wa { flex: none; min-width: 0; max-width: 1100px; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 12px 16px; }
  .wa.bad { border-color: color-mix(in srgb, var(--err) 35%, transparent); }
  .wa .md { font-size: 14px; line-height: 1.7; max-width: none; word-break: break-word; }
  .wa .md > :first-child { margin-top: 0; } .wa .md > :last-child { margin-bottom: 0; }
  .wa .md table { border-collapse: collapse; font-size: 13px; margin: 6px 0 10px; display: block; overflow-x: auto; max-width: 100%; }
  .wa .md th, .wa .md td { border: 1px solid var(--line2); padding: 4px 9px; text-align: left; vertical-align: top; }
  .wa .md th { background: var(--raised); font-weight: 600; }
  .wa .werr { color: var(--err); font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .wa .wmeta { font-size: 11.5px; color: var(--muted); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
  .wa .wmeta .btn.ghost { height: 24px; padding: 0 8px; font-size: 11.5px; background: transparent; border-color: transparent; color: var(--muted); box-shadow: none; }
  .wa .wmeta .btn.ghost:hover { color: var(--text); border-color: var(--line2); background: var(--surface); }
  .wa.live { border-color: color-mix(in srgb, var(--run) 35%, transparent); background: var(--runbg); }
  .wa .wlh { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .wa .wlh .mm { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .wa .wlh .sp { flex: 1; }
  .wspin { width: 13px; height: 13px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--run) 30%, transparent); border-top-color: var(--run); animation: wspin .8s linear infinite; flex: none; }
  @keyframes wspin { to { transform: rotate(360deg); } }
  .wlog { margin-top: 10px; font-family: var(--mono); font-size: 12px; line-height: 1.75; color: var(--text2); }
  .wlog:empty { display: none; }
  .wlog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wlog div.t { color: var(--text); font-family: var(--font); font-size: 13px; white-space: normal; }
  .wlog div.e { color: var(--err); }
  .wempty { margin: auto; max-width: 560px; text-align: center; color: var(--text2); font-size: 13.5px; line-height: 1.75; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .wempty > b { font-size: 16px; color: var(--text); }
  .wempty .wic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .wempty .wic svg { width: 22px; height: 22px; }
  .whints { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
  .whints .chip { cursor: pointer; font-weight: 500; }
  .whints .chip:hover { border-color: var(--accent); color: var(--text); }
  .winput { flex: none; display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--line); }
  .winput textarea.in { min-height: 56px; max-height: 240px; resize: none; font-size: 14px; line-height: 1.5; }
  .winput .btn { height: 56px; width: 54px; justify-content: center; padding: 0; flex: none; }
  .wwarn { flex: none; margin: 10px 16px 0; }

  /* ---------- 답변 아래: 이 차례에 바뀐 파일 ---------- */
  .wchg { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line2); font-size: 12px; color: var(--muted); }
  .wchg .cf { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--text2); font-family: var(--mono); font-size: 11.5px; cursor: pointer; max-width: 320px; }
  .wchg .cf span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wchg .cf:hover { border-color: var(--accent); color: var(--text); }
  .wchg .cf b { font-weight: 700; } .wchg .cf.A b { color: var(--ok); } .wchg .cf.M b { color: var(--warn); } .wchg .cf.D b { color: var(--err); }
  .wchg .cf.D { cursor: default; text-decoration: line-through; opacity: .7; } .wchg .cf.D:hover { border-color: var(--line); color: var(--text2); }

  /* ---------- 파일 패널: 폴더 트리 | 파일 보기(원문·미리보기·변경분) ---------- */
  .fbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 57px; border-bottom: 1px solid var(--line); min-width: 0; }
  .fbar .fp { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fbar .fp b { color: var(--text); font-weight: 600; }
  .fbar .seg { flex-wrap: nowrap; flex: none; } .fbar .seg .tab { height: 28px; padding: 0 10px; font-size: 12.5px; }
  .fbar .icon-btn { width: 30px; height: 30px; flex: none; }
  .fbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 230px minmax(0, 1fr); }
  .wfiles.notree .fbody { grid-template-columns: minmax(0, 1fr); } .wfiles.notree .ftree { display: none; }
  .ftree { overflow: auto; border-right: 1px solid var(--line); padding: 8px 6px; font-size: 12.5px; overscroll-behavior: contain; }
  .fr { display: flex; align-items: center; gap: 5px; height: 25px; padding-right: 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; color: var(--text2); }
  .fr:hover { background: var(--surface2); color: var(--text); }
  .fr.sel { background: var(--surface2); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent) inset; }
  .fr .cv { width: 12px; flex: none; color: var(--muted); font-size: 10px; text-align: center; }
  .fr .nm { overflow: hidden; text-overflow: ellipsis; }
  .fr.d .nm { color: var(--text); font-weight: 600; }
  .fr .chd { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex: none; margin-left: auto; } .fr .chd.A { background: var(--ok); }
  .ftree .fnote { color: var(--muted); font-size: 12px; padding: 6px 8px; }
  .fview { overflow: auto; min-width: 0; overscroll-behavior: contain; }
  .fempty { height: 100%; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; padding: 20px; }
  .fsrc { display: flex; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; min-width: max-content; }
  .fsrc pre { margin: 0; padding: 12px 0; font: inherit; background: none; border: 0; }
  .fsrc .ln { flex: none; text-align: right; padding-left: 12px; padding-right: 10px; color: var(--muted); opacity: .6; user-select: none; border-right: 1px solid var(--line); position: sticky; left: 0; background: var(--surface); }
  .fsrc .cd { padding-left: 12px; padding-right: 16px; white-space: pre; color: var(--text); }
  .fimg { padding: 16px; text-align: center; } .fimg img { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
  .fdiff { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; min-width: max-content; padding: 8px 0; }
  .fdiff div { white-space: pre; padding: 0 14px; }
  .fdiff .a { background: color-mix(in srgb, var(--ok) 13%, transparent); color: var(--ok); }
  .fdiff .d { background: color-mix(in srgb, var(--err) 13%, transparent); color: var(--err); }
  .fdiff .h { background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); margin-top: 6px; }
  .fdiff .m { color: var(--muted); }
  /* 문서 미리보기(마크다운) */
  .doc { max-width: 860px; margin: 0 auto; padding: 22px 28px 60px; font-size: 14.5px; line-height: 1.8; word-break: break-word; }
  .doc h1 { font-size: 24px; margin: 6px 0 14px; letter-spacing: -.02em; line-height: 1.3; }
  .doc h2 { font-size: 19px; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); letter-spacing: -.01em; }
  .doc h3 { font-size: 16px; margin: 24px 0 8px; } .doc h4, .doc h5, .doc h6 { font-size: 14.5px; margin: 20px 0 6px; color: var(--text2); }
  .doc p { margin: 10px 0; } .doc ul, .doc ol { margin: 8px 0; padding-left: 24px; } .doc li { margin: 3px 0; } .doc li > ul, .doc li > ol { margin: 2px 0; }
  .doc code { font-family: var(--mono); font-size: 12.5px; background: var(--surface2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .doc pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: var(--term); color: var(--term-text); padding: 12px 14px; border-radius: 10px; overflow: auto; border: 1px solid var(--line); margin: 12px 0; }
  .doc pre code { background: none; border: 0; padding: 0; color: inherit; }
  .doc pre.math { background: var(--surface2); color: var(--text); }
  .doc blockquote { margin: 12px 0; padding: 2px 14px; border-left: 3px solid var(--line2); color: var(--text2); }
  .doc table { border-collapse: collapse; font-size: 13.5px; margin: 12px 0; display: block; overflow-x: auto; max-width: 100%; }
  .doc th, .doc td { border: 1px solid var(--line2); padding: 5px 10px; text-align: left; vertical-align: top; } .doc th { background: var(--surface2); font-weight: 600; }
  .doc img { max-width: 100%; border-radius: 6px; } .doc hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
  .doc a { color: var(--accent); }

  /* ---------- 등록·설정 창 ---------- */
  dialog.wdlg { width: min(600px, calc(100vw - 32px)); padding: 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  dialog.wdlg::backdrop { background: rgba(0,0,0,.45); }
  dialog.wdlg h3 { margin: 0 0 4px; font-size: 16px; }
  dialog.wdlg .sub { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin: 0 0 10px; }
  dialog.wdlg label.l { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  dialog.wdlg input.mono { font-family: var(--mono); font-size: 12.5px; }
  dialog.wdlg { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; }
  .prow { display: flex; gap: 8px; } .prow .btn { flex: none; height: 38px; }
  /* 폴더 찾아보기: 바로 가기 · 지금 위치(조각마다 누르면 그리로) · 하위 폴더 · 선택 */
  .brw { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); overflow: hidden; }
  .bsc { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 10px 0; }
  .bsc .chip { cursor: pointer; height: 25px; font-size: 12px; font-weight: 500; } .bsc .chip:hover { border-color: var(--accent); color: var(--text); }
  .bcr { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 8px 10px; font-size: 12.5px; border-bottom: 1px solid var(--line); }
  .bcr a { color: var(--text2); padding: 2px 6px; border-radius: 6px; cursor: pointer; text-decoration: none !important; font-family: var(--mono); font-size: 12px; }
  .bcr a:hover { background: var(--raised); color: var(--text); } .bcr a:last-child { color: var(--text); font-weight: 700; }
  .bcr i { color: var(--muted); font-style: normal; font-size: 11px; }
  .bls { height: 220px; overflow: auto; padding: 6px; overscroll-behavior: contain; }
  .bls .bd { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 9px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .bls .bd:hover { background: var(--raised); }
  .bls .bd svg { color: var(--muted); flex: none; width: 15px; height: 15px; }
  .bls .bd span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bls .bd.up { color: var(--muted); }
  .bls .bnone { color: var(--muted); font-size: 12.5px; padding: 14px 10px; }
  .bft { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); background: var(--surface); }
  .bft .bi { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .bft .bi.no { color: var(--warn); }
  .wskills { display: flex; flex-wrap: wrap; gap: 6px; }
  .wskills .sk { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface2); color: var(--text2); font-size: 12.5px; cursor: pointer; user-select: none; }
  .wskills .sk:hover { border-color: var(--line2); color: var(--text); }
  .wskills .sk.on { border-color: color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); font-weight: 600; }
  .wskills .sk.auto { cursor: default; opacity: .85; } .wskills .sk small { color: var(--muted); font-weight: 400; }
  .wskills .none { color: var(--muted); font-size: 12.5px; }
  .wmodes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 560px) { .wmodes { grid-template-columns: 1fr; } }

  /* ---------- 실행 전 확인(「확인 후 실행」): 입력칸 위에 뜬다 ---------- */
  .wasks { flex: none; max-height: 46%; overflow: auto; padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .wasks:empty { display: none; }
  .wask { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warnbg); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .wask .ah { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
  .wask .ah b { color: var(--warn); flex: none; }
  .wask .ah code { font-family: var(--mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); padding: 1px 7px; border-radius: 6px; flex: none; }
  .wask .ah span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; color: var(--text); }
  .wask pre { margin: 8px 0; padding: 8px 10px; max-height: 180px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .wask .ab { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .wask .ab input.in { flex: 1; min-width: 160px; height: 30px; font-size: 12.5px; }
  .wsp .wdot.ask { background: var(--warn); }
  .wmodes label { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface2); cursor: pointer; }
  .wmodes label:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 60%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent) inset; }
  .wmodes input { accent-color: var(--accent); margin-top: 3px; }
  .wmodes b { font-size: 13.5px; } .wmodes span { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; }
  dialog.wdlg .chk { display: flex; align-items: flex-start; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--text2); line-height: 1.5; }
  dialog.wdlg .chk input { accent-color: var(--accent); margin-top: 3px; }
  dialog.wdlg .btns { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  dialog.wdlg .btns .sp { flex: 1; }
  dialog.wdlg .derr { color: var(--err); font-size: 12.5px; margin-top: 10px; white-space: pre-wrap; }
  dialog.wdlg .derr:empty { display: none; }
</style>
</head>
<body>
<div class="app">
  <header id="topbar"></header>

  <div class="body">
    <aside class="panel-card wside">
      <button class="btn add" id="btnAdd" onclick="openDlg(null)" title="작업할 폴더를 등록합니다"></button>
      <div class="sec"><span>작업 공간<span class="n" id="wcount">0</span></span></div>
      <div class="wlist" id="wlist"><div class="skel"></div><div class="skel" style="width:70%"></div></div>
    </aside>

    <main class="panel-card wmain" id="main">
      <div class="wcol">
        <div class="whead" id="whead" style="display:none">
          <div class="wt"><b id="hName"></b><span id="hPath"></span></div>
          <span class="badge" id="hMode"></span>
          <select class="in" id="wModel" title="이 요청에 쓸 모델"></select>
          <button class="icon-btn" id="btnFiles" onclick="toggleFiles()" title="파일 패널 열기/닫기 (Alt+P)"></button>
        </div>
        <div class="callout warn wwarn" id="wWarn" style="display:none"></div>
        <div class="wchat" id="wchat"></div>
        <div class="wasks" id="wasks"></div>
        <div class="winput" id="winput" style="display:none">
          <textarea class="in" id="wIn" rows="2" placeholder="이 폴더에서 할 일을 적으세요. 예) 3장 실험 결과 표를 최신 로그로 다시 채워 줘   (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
          <button class="btn primary" id="wSend" onclick="send()" title="보내기 (Enter)"></button>
        </div>
      </div>
      <aside class="wfiles" id="wfiles">
        <div class="fbar">
          <button class="icon-btn" id="fTreeBtn" onclick="toggleTree()" title="폴더 트리 접기/펴기"></button>
          <div class="fp" id="fPath"></div>
          <div class="seg" id="fModes"></div>
          <button class="icon-btn" id="fReload" onclick="reloadFiles()" title="새로 읽기"></button>
          <button class="icon-btn" id="fClose" onclick="toggleFiles(false)" title="파일 패널 닫기"></button>
        </div>
        <div class="fbody">
          <div class="ftree" id="ftree"></div>
          <div class="fview" id="fview"></div>
        </div>
      </aside>
    </main>
  </div>
</div>

<dialog class="wdlg" id="wDlg">
  <h3 id="dTitle">작업 공간 추가</h3>
  <p class="sub">이 PC 의 폴더를 고르면, 그 폴더를 작업 디렉터리로 한 Claude 세션과 대화하며 일할 수 있습니다. 코드 저장소가 아니어도 됩니다(논문·문서·실험 폴더).</p>
  <label class="l" for="dPath">폴더</label>
  <div class="prow">
    <input class="in mono" id="dPath" autocomplete="off" spellcheck="false" placeholder="아래에서 고르거나 경로를 붙여 넣으세요">
    <button class="btn" id="dBrowseBtn" onclick="toggleBrowse()" title="폴더 찾아보기 열기/닫기"></button>
  </div>
  <div class="brw" id="dBrw" style="display:none">
    <div class="bsc" id="bShort"></div>
    <div class="bcr" id="bCrumbs"></div>
    <div class="bls" id="bList"></div>
    <div class="bft"><span class="bi" id="bInfo"></span><button class="btn sm primary" id="bPick" onclick="pickDir()">이 폴더 선택</button></div>
  </div>
  <label class="l" for="dName">이름 <span style="font-weight:400">(비우면 폴더 이름)</span></label>
  <input class="in" id="dName" maxlength="80" autocomplete="off">
  <label class="l">실행 방식</label>
  <div class="wmodes">
    <label><input type="radio" name="dMode" value="bypass"><div><b>바로 실행</b><span>확인 없이 파일을 고치고 명령을 돌립니다. 대화가 끊기지 않습니다.</span></div></label>
    <label><input type="radio" name="dMode" value="ask"><div><b>확인 후 실행</b><span>파일 수정·명령 실행 전에 화면에서 허용/거부를 묻습니다(읽기·검색은 묻지 않음).</span></div></label>
  </div>
  <label class="l">스킬 <span style="font-weight:400">— 이 작업 공간의 세션에 실을 작업 지침(플랫폼 탭에서 등록·수정)</span></label>
  <div class="wskills" id="dSkills"></div>
  <label class="chk" id="dMcpRow"><input type="checkbox" id="dMcp"> <span>MCP 도구 사용 — 플랫폼 탭에 등록된 MCP 서버(운영 데이터 조회 등)의 도구를 이 작업 공간의 세션에도 싣습니다. 서버·인프라 작업용.</span></label>
  <div class="derr" id="dErr"></div>
  <div class="btns">
    <button class="btn danger" id="dDel" onclick="removeWs()" title="등록만 해제합니다 — 폴더와 파일은 그대로 둡니다">등록 해제</button>
    <span class="sp"></span>
    <button class="btn" onclick="$('wDlg').close()">취소</button>
    <button class="btn primary" id="dSave" onclick="saveWs()">저장</button>
  </div>
</dialog>
<dialog class="wdlg" id="riDlg">
  <h3>이슈로 등록</h3>
  <p class="sub">이 답변을 GitLab 이슈로 올립니다. 「바로 시작」을 켜 두면 이슈 에이전트가 분석부터 시작하고, 진행은 에이전트 탭에서 봅니다.</p>
  <label class="l" for="riProj">프로젝트</label>
  <select class="in" id="riProj"></select>
  <label class="l" for="riTitle">제목</label>
  <input class="in" id="riTitle" maxlength="255" autocomplete="off">
  <label class="l" for="riBody">내용 (마크다운 — 등록 전에 고칠 수 있습니다)</label>
  <textarea class="in" id="riBody" style="min-height:220px"></textarea>
  <label class="chk"><input type="checkbox" id="riStart" checked> <span>등록 후 에이전트가 바로 시작</span></label>
  <div class="btns">
    <span class="sp"></span>
    <button class="btn" onclick="$('riDlg').close()">취소</button>
    <button class="btn primary" id="riGo" onclick="registerIssue()">등록</button>
  </div>
</dialog>
<div class="toasts" id="toasts"></div>

<script src="/ui.js"></script>
<script>
const { $, esc, fmt, ago, dur, I, toast } = UI;
UI.topbar('workspace', '작업 공간');
UI.splitter('workspace', 320);
UI.pollAgentChip();
$('btnAdd').innerHTML = I.plus + '작업 공간 추가';
$('wSend').innerHTML = I.send;

const MODE_KO = { bypass: '바로 실행', ask: '확인 후 실행' };
const MODE_CLS = { bypass: 'run', ask: 'info' };
const STATE_KO = { DONE: '완료', FAILED: '실패', ABORTED: '중단됨' };
const HINTS = ['이 폴더가 어떤 구조인지 훑어보고 요약해 줘', '최근에 바뀐 내용을 정리해 줘', 'README 를 읽고 실행 방법을 알려 줘'];
const GEAR = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

// 상태: 고른 작업 공간(sel)·대화(thread, null = 새 대화)와 그 대화의 차례·활동 로그
const st = { info: null, list: [], sel: null, threads: [], thread: null, turns: [], events: [], lastEv: 0, liveId: 0, running: null, sending: false, editId: null, pending: [], asked: new Set(), decided: new Set() };
const getJ = async u => (await fetch(u, { cache: 'no-store' })).json();
const postJ = async (u, body) => (await fetch(u, { method: 'POST', body: new URLSearchParams(body || {}) })).json();
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (_) {} return null; };
const cur = () => st.list.find(w => w.id === st.sel) || null;
const live = () => { const t = st.turns[st.turns.length - 1]; return !!t && (t.state === 'NEW' || t.state === 'RUNNING'); };
const cut = (s, n) => { const t = String(s || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
const hashGet = () => { const m = /w=(\d+)/.exec(location.hash), t = /t=(\d+)/.exec(location.hash); return { w: m ? Number(m[1]) : null, t: t ? Number(t[1]) : null }; };
const hashSet = () => history.replaceState(null, '', st.sel ? '#w=' + st.sel + (st.thread ? '&t=' + st.thread : '') : location.pathname);

// ---------------------------------------------------------------- 목록
async function loadOverview() {
  let d; try { d = await getJ('/api/workspaces'); } catch (_) { return; }
  st.info = d; st.list = d.workspaces || [];
  if (!d.enabled) { $('wlist').innerHTML = `<div class="wnone">작업 공간이 꺼져 있습니다.<br>${esc(d.reason || '')}</div>`; $('btnAdd').disabled = true; renderMain(); return; }
  const ms = $('wModel'), keep = ms.value || ls('ws.model') || '';
  UI.set(ms, `<option value="">기본 (${esc(d.defaultModel || '')})</option>` + (d.models || []).map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join(''));
  ms.value = (d.models || []).includes(keep) ? keep : '';
  if (st.sel != null && !cur()) { st.sel = null; st.thread = null; st.turns = []; }
  if (st.sel == null && st.list.length) {
    const h = hashGet(), want = h.w || Number(ls('ws.sel')) || null;
    const w = st.list.find(x => x.id === want) || st.list[0];
    selectWs(w.id, h.w === w.id && h.t ? h.t : undefined); return;
  }
  renderList(); renderMain();
}
function renderList() {
  $('wcount').textContent = st.list.length;
  if (!st.list.length) { UI.set($('wlist'), '<div class="wnone">등록된 작업 공간이 없습니다.<br>위의 「작업 공간 추가」로 폴더를 등록하세요.</div>'); return; }
  UI.set($('wlist'), st.list.map(w => {
    const sel = w.id === st.sel;
    let h = `<div class="wsp${sel ? ' sel' : ''}${w.exists ? '' : ' gone'}"><div class="wh" onclick="selectWs(${w.id})" title="${esc(w.path)}${w.exists ? '' : '\n폴더가 없습니다'}">
      <div class="wn"><b>${esc(w.name)}</b><span>&lrm;${esc(w.path)}</span></div>${w.waiting ? '<span class="wdot ask" title="확인을 기다리는 중"></span>' : w.runningThread ? '<span class="wdot" title="작업 중"></span>' : ''}
      <button class="wgear" onclick="event.stopPropagation();openDlg(${w.id})" title="설정">${GEAR}</button></div>`;
    if (sel) {
      h += `<div class="wths"><div class="wth new${st.thread == null ? ' sel' : ''}" onclick="selectThread(null)">${I.plus}<span class="tt">새 대화</span></div>`
        + st.threads.map(t => `<div class="wth${t.id === st.thread ? ' sel' : ''}" onclick="selectThread(${t.id})" title="${esc(cut(t.title, 300))}">
            <span class="ts ${t.state === 'RUNNING' || t.state === 'NEW' ? 'run' : t.state === 'DONE' ? 'ok' : 'err'}"></span><span class="tt">${esc(cut(t.title, 60))}</span><span class="tw">${ago(t.updatedAt)}</span></div>`).join('')
        + '</div>';
    }
    return h + '</div>';
  }).join(''));
}
async function loadThreads() {
  const id = st.sel; if (id == null) return;
  let d; try { d = await getJ('/api/workspaces/' + id + '/threads'); } catch (_) { return; }
  if (id !== st.sel) return;
  st.threads = Array.isArray(d) ? d : [];
  renderList();
}
/** 작업 공간 선택. threadId 를 주지 않으면 실행 중인 대화 → 마지막으로 보던 대화 → 가장 최근 대화 순으로 연다. */
async function selectWs(id, threadId) {
  if (st.sel !== id) { st.sel = id; st.threads = []; st.thread = null; resetThread(); resetFiles(); }
  ls('ws.sel', String(id));
  renderList(); renderMain();
  await loadThreads();
  if (id !== st.sel) return;
  const w = cur(), has = t => st.threads.some(x => x.id === t);
  let t = threadId !== undefined ? threadId : (w && w.runningThread) || Number(ls('ws.thread.' + id)) || (st.threads[0] && st.threads[0].id) || null;
  selectThread(t != null && has(t) ? t : null);
}
function resetThread() { st.turns = []; st.events = []; st.lastEv = 0; st.liveId = 0; st.running = null; st.pending = []; renderAsks(); }
function selectThread(id) {
  st.thread = id; resetThread();
  if (st.sel != null) ls('ws.thread.' + st.sel, id ? String(id) : null);
  hashSet(); renderList(); renderMain();
  if (id) loadThread(false).then(() => { const b = $('wchat'); b.scrollTop = b.scrollHeight; });
  $('wIn').focus();
}
window.addEventListener('hashchange', () => { const h = hashGet(); if (h.w && (h.w !== st.sel || (h.t || null) !== st.thread) && st.list.some(w => w.id === h.w)) selectWs(h.w, h.t); });

// ---------------------------------------------------------------- 대화
async function loadThread(inc) {
  const id = st.thread; if (!id) return;
  let d; try { d = await getJ('/api/workspaces/threads/' + id + '?afterId=' + (inc ? st.lastEv : 0)); } catch (_) { return; }
  if (id !== st.thread) return;                     // 그 사이 다른 대화로 옮겼다
  const was = live();
  if (!inc || d.liveId !== st.liveId) { st.events = []; if (!inc) st.lastEv = 0; }
  st.turns = d.turns || []; st.liveId = d.liveId; st.running = d.running || null; st.pending = d.pending || [];
  renderAsks();
  for (const e of d.events || []) { if (e.id > st.lastEv || !inc) { st.events.push(e); st.lastEv = Math.max(st.lastEv, e.id); } }
  if (st.events.length > 400) st.events = st.events.slice(-400);
  renderMain();
  if (was && !live()) { loadOverview(); loadThreads(); if (fs.open) reloadFiles(); }   // 방금 끝났다: 목록의 상태·파일 패널 갱신
  else if (fs.open) renderTree();                          // 바뀐 파일 표시가 달라졌을 수 있다(다른 대화를 열었을 때)
}
function renderMain() {
  const w = cur(), b = $('wchat');
  $('whead').style.display = w ? '' : 'none'; $('winput').style.display = w ? '' : 'none';
  const warn = $('wWarn');
  if (!w) {
    warn.style.display = 'none';
    const off = st.info && !st.info.enabled;
    UI.set(b, `<div class="wempty"><div class="wic">${I.terminal}</div><b>작업 공간</b>
      <div>${off ? '작업 공간이 꺼져 있습니다.' : '폴더를 등록하면 그 폴더에서 Claude 세션과 대화하며 일할 수 있습니다 — 파일 수정, 명령·실험 실행, 질문.<br>이슈를 만들지 않고 바로 소통하며 처리하는 길이고, 대화는 작업 공간마다 따로 이어집니다.'}</div>
      ${off ? '' : `<button class="btn primary" onclick="openDlg(null)">${I.plus}작업 공간 추가</button>`}</div>`);
    return;
  }
  $('hName').textContent = w.name; $('hPath').textContent = w.path;
  const hm = $('hMode'); hm.textContent = MODE_KO[w.mode] || w.mode; hm.className = 'badge ' + (MODE_CLS[w.mode] || '');
  hm.title = '이 작업 공간의 실행 방식' + (w.opsMcp ? ' · MCP 도구 사용' : '') + ((w.skills || []).length ? ' · 스킬 ' + w.skills.join(', ') : '') + ' — 왼쪽 목록의 톱니바퀴에서 바꿉니다';
  const lim = st.info && st.info.limited;
  if (!w.exists) { warn.style.display = 'flex'; warn.innerHTML = `<span class="ic">${I.warn}</span><span>폴더가 없습니다: <b>${esc(w.path)}</b> — 옮겼다면 설정(톱니바퀴)에서 경로를 고치세요.</span>`; }
  else if (lim) { warn.style.display = 'flex'; warn.innerHTML = `<span class="ic">${I.warn}</span><span>Claude 사용량 한도에 걸려 있습니다${st.info.limitUntil ? ' (리셋 ' + esc(st.info.limitUntil) + ')' : ''}. 리셋 뒤에 보낼 수 있습니다.</span>`; }
  else warn.style.display = 'none';

  const stick = b.scrollHeight - b.scrollTop - b.clientHeight < 90;
  let h = '';
  if (!st.turns.length) {
    h = st.thread ? '<div class="wempty"><div>불러오는 중…</div></div>'
      : `<div class="wempty"><div class="wic">${I.terminal}</div><b>${esc(w.name)}</b>
        <div>이 폴더에서 할 일을 적으면 세션이 바로 시작합니다. 같은 대화는 맥락을 이어 가고, 왼쪽의 「새 대화」는 새 세션으로 시작합니다.<br>
        실행 방식: <b>${MODE_KO[w.mode] || esc(w.mode)}</b>${w.mode === 'ask' ? ' — 파일 수정·명령 실행 전에 여기서 허용/거부를 묻습니다.' : ' — 확인 없이 바로 진행됩니다.'}${(w.skills || []).length ? '<br>스킬: ' + w.skills.map(esc).join(', ') : ''}</div>
        <div class="whints">${HINTS.map(x => `<button class="chip" onclick="hint(this)">${esc(x)}</button>`).join('')}</div></div>`;
  }
  for (const t of st.turns) {
    h += `<div class="wq"><div class="bub">${esc(t.question)}</div></div>`;
    if (t.state === 'NEW' || t.state === 'RUNNING') {
      const since = t.startedAt ? dur(Date.now() - new Date(t.startedAt).getTime()) : '';
      const log = st.events.filter(e => e.kind !== 'STATE' && e.kind !== 'TOOL_RESULT').slice(-14).map(e =>
        `<div class="${e.kind === 'ERROR' ? 'e' : e.kind === 'TEXT' ? 't' : ''}">${e.kind === 'TOOL' ? '▸ ' : ''}${esc(e.message || '')}</div>`).join('');
      h += `<div class="wa live"><div class="wlh"><span class="wspin"></span><b>${t.state === 'NEW' ? '시작하는 중…' : '작업 중'}</b>
        <span class="mm">${since}${st.running ? ' · ' + esc(st.running.model || '') : ''}</span><span class="sp"></span>
        <button class="btn sm danger" onclick="abortTurn(${t.id})">중단</button></div><div class="wlog">${log}</div></div>`;
    } else {
      const bad = t.state !== 'DONE';
      h += `<div class="wa ${bad ? 'bad' : ''}">${t.answerMd ? `<div class="md">${UI.mdLite(t.answerMd)}</div>` : ''}
        ${t.lastError ? `<div class="werr">${esc(t.lastError)}</div>` : ''}${chgHtml(t)}

}

async function send() {
  const w = cur(), inp = $('wIn'), q = inp.value.trim(); if (!w || !q || st.sending) return;
  if (live()) { toast('앞선 요청을 처리하는 중입니다. 끝난 뒤(또는 중단한 뒤) 보내세요.', 'warn'); return; }

    if (st.sel !== w.id) { toast('「' + w.name + '」 에 요청을 보냈습니다.', 'ok'); loadOverview(); return; }   // 보내는 사이 다른 작업 공간으로 옮겼다

}
async function abortTurn(id) {

// ---------------------------------------------------------------- 다른 탭에서 넘겨받은 글(리서치 「작업 공간으로」): 입력칸에 넣기만 하고 보내는 것은 사용자가

  if (cur()) { selectThread(null); inp.focus(); if (mark >= 0) inp.setSelectionRange(mark, mark + '(여기에 할 일을 적으세요)'.length); inp.scrollTop = 0; }
  toast((d.from || '넘겨받은 글') + ' 을 입력칸에 넣었습니다 — ' + (st.list.length > 1 ? '작업 공간을 고르고 ' : '') + '할 일을 적어 보내세요.', 'ok');
}

// ---------------------------------------------------------------- 실행 전 확인(「확인 후 실행」 작업 공간)

// 대화 영역과 따로 그린다 — 진행 표시가 2초마다 다시 그려져도 거부 사유를 치던 글이 지워지지 않게.

  const el = $('wasks'); if (!el) return;

  if (fresh) loadOverview();                         // 왼쪽 목록의 「확인 대기」 점을 바로 켠다
  st.pending = st.pending.filter(p => !st.decided.has(p.id));   // 방금 답한 것이 늦게 온 조회 응답으로 되살아나지 않게
  const typed = {}; el.querySelectorAll('[data-ask]').forEach(c => { typed[c.dataset.ask] = c.querySelector('input').value; });   // 치던 거부 사유 보존
  const done = () => el.querySelectorAll('[data-ask]').forEach(c => { if (typed[c.dataset.ask]) c.querySelector('input').value = typed[c.dataset.ask]; });
  setTimeout(done, 0);
  UI.set(el, st.pending.map(p => `<div class="wask" data-ask="${p.id}">
    <div class="ah"><b>실행 전 확인</b><code>${esc(p.tool)}</code><span title="${esc(p.summary)}">${esc(p.summary)}</span></div>
    ${p.detail && p.detail !== p.summary ? `<pre>${esc(p.detail)}</pre>` : '<div style="height:8px"></div>'}
    <div class="ab"><button class="btn sm primary" data-act="allow">${I.check}허용</button>
      <button class="btn sm" data-act="always" title="이번 요청이 끝날 때까지 ${esc(p.tool)} 은(는) 다시 묻지 않습니다">이번 요청은 ${esc(p.tool)} 계속 허용</button>
      <input class="in" placeholder="거부할 때 전할 말(선택) — 예: 그 파일은 건드리지 마" maxlength="300">
      <button class="btn sm danger" data-act="deny">${I.x}거부</button></div></div>`).join(''));
}
async function decideAsk(id, act, message) {
  const body = { allow: act === 'deny' ? 'false' : 'true', remember: act === 'always' ? 'true' : 'false' }; if (act === 'deny' && message) body.message = message;
  st.decided.add(id); renderAsks();
  try { const r = await postJ('/api/workspaces/approvals/' + id, body); if (!r.ok) toast(r.result, 'warn'); } catch (e) { toast('확인을 보내지 못했습니다', 'err'); }

$('wasks').addEventListener('click', e => {

// ---------------------------------------------------------------- 파일 패널: 폴더 트리 | 파일 보기(원문·마크다운 미리보기·git 변경분)

const IC_FOLDER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const IC_TREE = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>';
$('btnFiles').innerHTML = IC_FOLDER; $('fTreeBtn').innerHTML = IC_TREE; $('fReload').innerHTML = I.refresh; $('fClose').innerHTML = I.x;
const fs = { open: false, dirs: new Map(), expanded: new Set(['']), file: null, data: null, mode: 'source', diff: null, err: null, tick: 0 };
const rawUrl = (p, v) => `/api/workspaces/${st.sel}/raw?path=${encodeURIComponent(p)}${v ? '&v=' + v : ''}`;
const isMd = p => /\.(md|markdown|mdx)$/i.test(p || '');
const unesc = s => String(s).replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');   // esc 의 반대
/** 문서 안의 상대 경로(../fig/a.png)를 루트 기준 경로로. */
function joinPath(base, u) {
  let s = String(u).split('#')[0].split('?')[0]; try { s = decodeURI(s); } catch (_) {}
  const out = s.startsWith('/') ? [] : (base ? base.split('/') : []);
  for (const p of s.split('/')) { if (!p || p === '.') continue; if (p === '..') out.pop(); else out.push(p); }
  return out.join('/');
}
/** 지금 대화에서 가장 최근에 파일을 바꾼 차례의 변경 목록(경로 → A/M/D). 트리의 점 표시에 쓴다. */
function changedMap() {
  const m = new Map();

}
function chgHtml(t) {

    const k = l[0], p = l.slice(2), name = p.slice(p.lastIndexOf('/') + 1);
    return `<span class="cf ${k}"${k === 'D' ? '' : ` data-open="${esc(p)}"`} title="${esc(p)} (${k === 'A' ? '새 파일' : k === 'M' ? '수정' : '삭제'})"><b>${k}</b><span>${esc(name)}</span></span>`;

function toggleFiles(on) {

function toggleTree() { const off = $('wfiles').classList.toggle('notree'); ls('ws.tree', off ? '0' : null); }
function resetFiles() {

  fs.file = st.sel != null ? ls('ws.file.' + st.sel) : null;

async function loadDir(dir) {
  const ws = st.sel; if (ws == null) return;

function toggleDir(path) {

}
/** 파일 열기. 패널이 닫혀 있으면 열고, 트리에서 그 파일까지의 폴더를 펼친다. */

async function loadFile(force) {
  const ws = st.sel, path = fs.file; if (ws == null || !path) return;

  let d; try { d = await getJ(`/api/workspaces/${ws}/file?path=${encodeURIComponent(path)}${seen ? '&ifMtime=' + seen : ''}`); } catch (_) { return; }

}
async function loadDiff() {
  const ws = st.sel, path = fs.file; if (ws == null || !path) return;

function setMode(m) {

}
async function reloadFiles() {
  if (st.sel == null) return;

}
function renderView() {

  if (!p) { $('fPath').textContent = ''; $('fModes').innerHTML = ''; UI.set(v, '<div class="fempty"><div>왼쪽에서 파일을 고르세요.<br>답변 아래의 「바뀐 파일」을 눌러도 여기에 열립니다.</div></div>'); return; }

  const text = d && d.text != null, modes = text ? (isMd(p) ? [['preview', '미리보기'], ['source', '원문'], ['diff', '변경분']] : [['source', '원문'], ['diff', '변경분']]) : [];

  $('fModes').style.display = modes.length ? '' : 'none';

  else if (d.image) h = `<div class="fimg"><img src="${rawUrl(p, d.mtime)}" alt="${esc(d.name)}"></div>`;
  else if (d.tooBig) h = `<div class="fempty"><div>파일이 커서(${(d.size / 1048576).toFixed(1)} MB) 여기서는 열지 않습니다.</div></div>`;
  else if (d.binary) h = '<div class="fempty"><div>글이 아닌 파일이라 내용을 보여 주지 않습니다.</div></div>';

function diffHtml(d) {

  if (!d.git) return '<div class="fempty"><div>이 폴더는 git 저장소가 아니어서(또는 아직 커밋이 없어서) 변경분을 비교할 수 없습니다.<br>바뀐 파일 목록은 답변 아래에 표시됩니다.</div></div>';
  if (!d.diff || !d.diff.trim()) return `<div class="fempty"><div>${d.untracked ? '새 파일입니다(아직 커밋된 적 없음) — 전체가 새 내용입니다. 「원문」에서 보세요.' : '마지막 커밋과 같습니다(변경 없음).'}</div></div>`;

    if (!on) continue;                                   // 파일 머리(diff --git · index · --- · +++)
    const c = l[0];

/** 문서 미리보기용 마크다운: 제목·문단(줄 이어 붙임)·중첩 목록·인용·코드·표·그림(상대 경로는 작업 공간에서)·링크·굵게/기울임. 수식($…$)은 글자 그대로 둔다. */
function mdDoc(src, base) {

      // 주소(u)는 이미 esc 를 거친 글이다. 작업 공간 안의 경로는 원래 글자로 되돌려 풀고(joinPath 가 %22 같은 것을 다시 따옴표로 만든다)
      // 속성에 넣을 때 반드시 다시 esc 한다 — 빠뜨리면 문서 속 링크가 속성을 끼워 넣어 스크립트를 실행시킬 수 있다. 그림은 https 와 작업 공간 파일만.
      .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^)]*&quot;)?\)/g, (_, a, u) => `<img alt="${a}" src="${/^https?:\/\//i.test(u) ? u : esc(rawUrl(joinPath(base, unesc(u))))}">`)
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => /^https?:\/\//i.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : u.startsWith('#') || /^[a-z][a-z0-9+.-]*:/i.test(unesc(u)) ? t : `<a href="#" data-open="${esc(joinPath(base, unesc(u)))}">${t}</a>`)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>').replace(/~~([^~]+)~~/g, '<del>$1</del>')

    }

    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out += '<hr>'; i++; continue; }

      out += `<blockquote>${mdDoc(buf.join('\n'), base)}</blockquote>`; continue;
    }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {

          const box = /^\[( |x|X)\]\s+(.*)$/.exec(k[3]);

        if (/^\s{2,}\S/.test(x) || !special(x)) { out += ' ' + inline(x.trim()); i++; continue; }   // 항목에 이어지는 줄
        break;

    while (i < lines.length && lines[i].trim() && !special(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])) buf.push(lines[i++].trim());
    out += `<p>${buf.map(inline).join(' ')}</p>`;
  }

}
const docMemo = UI.memo(k => { const j = k.indexOf('\u0001'); return mdDoc(k.slice(j + 1), k.slice(0, j)); }, 6);

{ const pref = ls('ws.files'); fs.open = pref == null ? window.innerWidth >= 1500 : pref === '1'; $('main').classList.toggle('files', fs.open); }
