services:
  postgres:
    image: postgres:16
    container_name: dev-agent-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=dev_agent
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    ports:
      - "5432:5432"            # 로컬 개발 시 호스트에서 접속 (app 로컬 실행)
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dev_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

