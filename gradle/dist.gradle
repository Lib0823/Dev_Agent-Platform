// 배포판 만들기 — 실행 파일(더블클릭)로 돌리는 패키지.
//   gradlew dist          : 이 OS 용 앱 이미지(build/dist/Dev Agent/ — Windows 는 "Dev Agent.exe", macOS 는 "Dev Agent.app") + zip
//   gradlew distPortable  : OS 공통 묶음(build/dist/dev-agent-<버전>-portable.zip — jar + 실행 스크립트, Java 17+ 필요)
// 앱 이미지는 자체 Java 런타임(jlink)을 품으므로 받는 쪽에 Java 가 없어도 된다. jpackage 는 "지금 빌드하는 OS" 용만 만들 수 있다
// (macOS 용 .app 은 맥에서 gradlew dist). 설치 프로그램(msi/dmg)은 만들지 않는다 — 폴더째 옮기면 된다.

def jdkHome = javaToolchains.launcherFor(java.toolchain).get().metadata.installationPath.asFile
def isWin = org.gradle.internal.os.OperatingSystem.current().isWindows()
def isMac = org.gradle.internal.os.OperatingSystem.current().isMacOsX()
def osTag = isWin ? 'windows' : isMac ? 'macos' : 'linux'
def tool = { String name -> new File(jdkHome, "bin/${name}${isWin ? '.exe' : ''}").absolutePath }
def workDir = layout.buildDirectory.dir('dist-work').get().asFile
def distDir = layout.buildDirectory.dir('dist').get().asFile
def appName = 'Dev Agent'

// 앱이 쓰는 JDK 모듈만 담은 런타임(약 60MB). java/javaw 실행 파일을 남긴다 — 감시자(Launcher)가 앱을 자식 JVM 으로 띄운다.
def modules = ['java.base', 'java.desktop', 'java.instrument', 'java.logging', 'java.management', 'java.naming', 'java.net.http',
               'java.prefs', 'java.rmi', 'java.scripting', 'java.security.jgss', 'java.security.sasl', 'java.sql', 'java.sql.rowset',
               'java.transaction.xa', 'java.xml', 'java.xml.crypto', 'jdk.crypto.ec', 'jdk.crypto.cryptoki', 'jdk.unsupported',
               'jdk.zipfs', 'jdk.charsets', 'jdk.localedata', 'jdk.management', 'jdk.net']
if (isWin) {
    modules << 'jdk.crypto.mscapi'
}

tasks.register('distInput', Sync) {
    description = '배포판에 들어갈 파일(jar · scripts · 안내문)을 모은다'
    dependsOn 'bootJar'
    into new File(workDir, 'input')
    from(tasks.named('bootJar')) {
        rename { 'dev-agent.jar' }
    }
    from('scripts') {
        into 'scripts'
        exclude 'setup-preview.ps1', 'preview-tomcat.cmd'
    }
}

tasks.register('distRuntime', Exec) {
    description = 'jlink 로 전용 Java 런타임을 만든다'
    def out = new File(workDir, 'runtime')
    outputs.dir out
    inputs.property 'modules', modules.join(',')
    doFirst { delete out }
    commandLine tool('jlink'), '--add-modules', modules.join(','), '--include-locales', 'en,ko',
            '--no-header-files', '--no-man-pages', '--compress', '2', '--strip-debug', '--output', out.absolutePath
}

tasks.register('distApp', Exec) {
    description = 'jpackage 로 앱 이미지(실행 파일 + 런타임 + jar)를 만든다'
    dependsOn 'distInput', 'distRuntime'
    doFirst { delete new File(distDir, isMac ? "${appName}.app" : appName) }
    def args = [tool('jpackage'), '--type', 'app-image', '--name', appName, '--app-version', project.version.toString(),
                '--vendor', 'Dev Agent', '--input', new File(workDir, 'input').absolutePath, '--main-jar', 'dev-agent.jar',
                '--arguments', '--launch', '--runtime-image', new File(workDir, 'runtime').absolutePath, '--dest', distDir.absolutePath,
                // 감시자 JVM 은 트레이와 자식 감시만 한다 — 작게
                '--java-options', '-Xmx48m', '--java-options', '-XX:+UseSerialGC', '--java-options', '-XX:TieredStopAtLevel=1',
                '--java-options', '-Dfile.encoding=UTF-8']
    def ico = file('gradle/dist/dev-agent.ico')
    if (isWin && ico.exists()) {
        args += ['--icon', ico.absolutePath]
    }
    commandLine args
}

tasks.register('dist', Zip) {
    description = '이 OS 용 배포 zip(build/dist/dev-agent-<버전>-<os>.zip)'
    group = 'distribution'
    dependsOn 'distApp'
    archiveFileName = "dev-agent-${project.version}-${osTag}.zip"
    destinationDirectory = distDir
    from(distDir) {
        include isMac ? "${appName}.app/**" : "${appName}/**"
    }
    from('gradle/dist') {
        include 'README.txt'
    }
}

tasks.register('distPortable', Zip) {
    description = 'OS 공통 묶음(jar + 실행 스크립트, Java 17+ 필요)'
    group = 'distribution'
    dependsOn 'distInput'
    archiveFileName = "dev-agent-${project.version}-portable.zip"
    destinationDirectory = distDir
    into 'dev-agent'
    from(new File(workDir, 'input'))
    from('gradle/dist') {
        include 'README.txt'
    }
    from('gradle/dist') {
        include 'dev-agent.sh', 'dev-agent.cmd'
        filePermissions { unix('rwxr-xr-x') }
    }
}
